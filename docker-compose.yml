services:
  postgres:
    image: postgres:17-alpine
    container_name: viceatlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: viceatlas
    ports:
      - "5433:5432"
    volumes:
      - viceatlas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d viceatlas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  viceatlas_pgdata:
